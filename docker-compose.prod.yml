services:
  postgres:
    image: postgres:18
    container_name: hanjes-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: trade-opportunity-backend

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    restart: unless-stopped

volumes:
  postgres_data:
